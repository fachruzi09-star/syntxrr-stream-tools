name: Build SYNTXRR STREAM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - appjet
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web application
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Run Android unit tests
        id: unit-tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest

      - name: Print failed unit test details
        if: ${{ failure() && steps.unit-tests.outcome == 'failure' }}
        shell: bash
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob("android/app/build/test-results/testDebugUnitTest/TEST-*.xml")):
              root = ET.parse(path).getroot()
              for tc in root.findall("testcase"):
                  for tag in ("failure", "error"):
                      elem = tc.find(tag)
                      if elem is not None:
                          print(f"FAILED: {tc.attrib.get('classname')}#{tc.attrib.get('name')}")
                          print(elem.attrib.get("message", ""))
                          if elem.text:
                              print(elem.text)
          EOF

      - name: Upload Android unit test reports
        if: ${{ !cancelled() && (steps.unit-tests.outcome == 'success' || steps.unit-tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: SYNTXRR-STREAM-Unit-Test-Reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: SYNTXRR-STREAM-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  dependency-submission:
    name: Submit Gradle Dependency Graph
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node version
        run: node --version

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web application
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: android
          dependency-graph: generate-and-submit
          cache-provider: basic